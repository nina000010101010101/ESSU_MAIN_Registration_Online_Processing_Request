<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Form</title>
  <link rel="stylesheet" href="./src/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --forest-900: #0c2a1e;
      --forest-800: #18392b;
      --forest-line: rgba(255, 255, 255, 0.15);
      --gold-500: #d4af78;
      --gold-400: #e3b53f;
    }
     
    body {
      background-color: #0c2a1e;
      background-image:
        radial-gradient(circle at 18% 20%, rgba(212, 175, 120, 0.10), transparent 40%),
        radial-gradient(circle at 82% 78%, rgba(212, 175, 120, 0.08), transparent 45%),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 1px, transparent 1px, transparent 14px),
        linear-gradient(160deg, #0a2318 0%, #123725 45%, #0c2a1e 100%);
      background-attachment: fixed;
    }

    .masthead { background: var(--forest-900); }
    .masthead .wrap{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;gap:24px;}
    .masthead-left{display:flex;align-items:center;gap:18px;min-width:0;}
    .masthead-right{display:flex;align-items:center;gap:22px;flex-shrink:0;}
    .logo-slot{width:56px;height:56px;border-radius:50%;background:var(--forest-800);border:1.5px solid var(--gold-500);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
    .logo-slot img{width:100%;height:100%;object-fit:contain;}
    .logo-slot .fallback{color:var(--gold-400);font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;}
    .logo-label{font-size:10px;letter-spacing:.06em;color:#8fa596;text-transform:uppercase;text-align:center;margin-top:4px;}
    .logo-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
    .masthead-divider{width:1px;align-self:stretch;background:var(--forest-line);flex-shrink:0;}
    .masthead-text{color:#fff;min-width:0;}
    .masthead-text .country{font-size:11.5px;letter-spacing:.08em;color:var(--gold-400);font-weight:600;text-transform:uppercase;margin:0 0 4px;}
    .masthead-text .agency{font-size:19px;font-weight:700;margin:0;}
    .masthead-text .tagline{font-size:13px;color:#e3b53f;margin:3px 0 0;}

  </style>
</head>

<body class="min-h-screen flex flex-col items-center bg-cover bg-center bg-no-repeat">

<div class="masthead w-full">
  <div class="wrap">
    <div class="masthead-left">
      <div class="logo-slot" id="webLogo">
        <img src="./img/logoweb2.png" alt="Web Logo"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="fallback" style="display:none;">WEB</span>
      </div>
      <div class="masthead-divider"></div>
      <div class="masthead-text">
        <p class="agency">Eastern Samar State University</p>
        <p class="tagline">Main Campus, Borongan City — ESSU Main: Registrar Online Processing System</p>
      </div>
    </div>

    <div class="masthead-right">
      <div class="logo-slot" id="schoolLogo">
        <img src="./img/logo2.png" alt="School Logo"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="fallback" style="display:none;">ESSU</span>
      </div>
      <div class="logo-slot" id="bagongPilipinasLogo">
        <img src="./img/BAGONG-PILIPINAS-LOGO-1-1.png" alt="Bagong Pilipinas Logo"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="fallback" style="display:none;">Logo</span>
      </div>
      <div class="logo-slot" id="transparencyLogo">
        <img src="./img/transparencylogo.png" alt="Transparency Logo"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="fallback" style="display:none;">Logo</span>
      </div>
    </div>
  </div>
</div>

<div class="w-full flex-1 flex items-center justify-center p-8">
<div class="w-full max-w-xl p-8 rounded-2xl shadow-2xl border border-white/20" style="background:#18392b">

  <form action="#" method="POST" id="registerForm">

    <h1 class="text-amber-50 font-bold text-2xl text-center">ESSU Main:</h1>
    <h1 class="text-amber-50 font-bold text-xl text-center">Registrar Online Processing Request</h1>
    <br>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-white mb-2">Student ID/Admin ID</label>
        <input
          type="text"
          id="studentNumber"
          name="studentNumber"   
          placeholder="00-00000"
          style="color: white !important;"
          class="w-full px-4 py-3 border rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"required>
      </div>

      <div>
        <label class="block text-white mb-2">Email</label>
        <input
          type="text"
          id="email"
          name="email"
          placeholder="your@gmail.com"
          style="color: white !important;"
          class="w-full px-4 py-3 border rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"required>
      </div>
    </div>
    
    <div class="mb-4">
      <label class="block text-white mb-2">Full Name</label>
      <input
        type="text"
        id="fullName"
        name="FullName"
        placeholder="Trisha Mae E. Boco"
        style="color: white !important;"
        class="w-full px-4 py-3 border rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"required>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-white mb-2">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Password"
          class="w-full px-4 py-3 border rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"required>
      </div>

      <div>
        <label class="block text-white mb-2">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm Password"
          class="w-full px-4 py-3 border rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"required>
      </div>
    </div>
    <br>
    <p
    id="errorMsg"
    style="color: #ff6b6b; text-align: center; opacity: 0;"
    class="mb-4">
    </p>

    <button
    type="submit"
    id="registerBtn"
    class="w-full py-3 rounded-full bg-white text-gray-800 font-semibold hover:bg-gray-100 transition">Register
    </button>

    <p class="text-center text-gray-600 mt-6">
      Already have an account?
      <a href="login.html" class="text-blue-600 hover:underline">
      Login
      </a>
    </p>
   </form>
</div>
<script type="module" src="register.js" defer></script>
</body>
</html>
